# Runs the 3-node demo (demo-3nodes.sh) on a GitHub-hosted runner, so the
# output can be read in the Actions tab without installing Docker locally.
#
# The script only PRINTS what each node answers. It does not check the
# answers, so a green run means "the demo ran to the end", not "the behaviour
# is correct". Read the logs.

name: "Demo: 3 nodes"

# Manual trigger only: the "Run workflow" button in the Actions tab, or
# "gh workflow run demo-3nodes.yml" from a terminal. Nothing runs on push.
on: workflow_dispatch

# The job only needs to read the repository.
permissions:
  contents: read

jobs:
  demo:
    name: Run the 3-node demo

    # GitHub's Ubuntu runners ship with Docker, Docker Compose, bash and curl,
    # which is everything the script needs.
    runs-on: ubuntu-latest

    # Kill the job if it runs longer than this. The script waits for the nodes
    # to start without a time limit of its own, so this is the safety net.
    timeout-minutes: 1

    steps:
      # Download the repository onto the runner.
      - uses: actions/checkout@v6

      # Starts node-a, node-b and node-c, runs the experiment in CP mode and
      # then in AP mode, and removes the containers. The results are this
      # step's output.
      - name: Run demo-3nodes.sh
        run: ./demo-3nodes.sh
