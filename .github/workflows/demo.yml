# Runs the two demo scripts on a GitHub-hosted runner, so the output can be
# read in the Actions tab without installing Docker locally.
#
# The scripts only PRINT what each node answers. They do not check the
# answers, so a green run means "the demo ran to the end", not "the behaviour
# is correct". Read the logs.

name: Demo

# Manual trigger only: the "Run workflow" button in the Actions tab, or
# "gh workflow run demo.yml" from a terminal. Nothing runs on push.
on: workflow_dispatch

# The job only needs to read the repository.
permissions:
  contents: read

jobs:
  demo:
    # Shown in the Actions UI as "2 nodes" and "3 nodes".
    name: ${{ matrix.nodes }} nodes

    # GitHub's Ubuntu runners ship with Docker, Docker Compose, bash and curl,
    # which is everything the scripts need.
    runs-on: ubuntu-latest

    # Kill the job if it runs longer than this. The scripts wait for the nodes
    # to start without a time limit of their own, so this is the safety net.
    timeout-minutes: 1

    # One job per example, running in parallel on separate runners. Both
    # examples use the same container names and ports, so they could not share
    # a machine at the same time anyway.
    strategy:
      # If one example fails, still let the other finish.
      fail-fast: false
      matrix:
        nodes: [2, 3]

    steps:
      # Download the repository onto the runner.
      - uses: actions/checkout@v6

      # Runs demo-2nodes.sh or demo-3nodes.sh, depending on the matrix value.
      - name: Run the ${{ matrix.nodes }}-node demo
        run: ./demo-${{ matrix.nodes }}nodes.sh
